ci:
  autoupdate_branch: ripple-dev
  skip: [uv-lock]

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock
        args: ["--upgrade"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: src/
      - id: ruff-format
        files: src/
  
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
    - id: pyright
      files: src/
      additional_dependencies: [jax, jaxtyping, typing_extensions, numpy]
